name: Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backtest/*.py"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy matplotlib yfinance
      - name: Download FRED series
        timeout-minutes: 10
        run: |
          mkdir -p backtest/cache backtest/results
          for id in T10Y2Y BAMLH0A0HYM2 BAA10Y TOTLL DRCCLACBS FEDFUNDS TB3MS; do
            curl -sSL --retry 4 --retry-delay 5 --connect-timeout 20 --max-time 90 \
              -A "Mozilla/5.0 (X11; Linux x86_64)" \
              -o backtest/cache/$id.csv "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$id" \
              && echo "$id $(wc -l < backtest/cache/$id.csv) lines" || echo "$id FAILED"
          done 2>&1 | tee backtest/results/download.log
      - name: Run backtest
        timeout-minutes: 15
        run: python -u backtest/finance_backtest.py 2>&1 | tee backtest/results/run.log; exit ${PIPESTATUS[0]}
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/results
          git diff --cached --quiet || git commit -m "Backtest results (finance)"
          git pull --rebase origin main
          git push

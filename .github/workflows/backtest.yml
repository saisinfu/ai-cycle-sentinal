name: Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backtest/*.py"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy matplotlib yfinance
      - run: mkdir -p backtest/results
      - name: Run backtest
        timeout-minutes: 15
        run: python -u backtest/finance_backtest.py 2>&1 | tee backtest/results/run.log; exit ${PIPESTATUS[0]}
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/results
          git diff --cached --quiet || git commit -m "Backtest results (finance)"
          git pull --rebase origin main
          git push

name: Probe data sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml", "backtest/discover.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p backtest/results && python3 backtest/discover.py || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/results/discover.log && git commit -m "discover log" && git pull --rebase origin main && git push

name: Probe data sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p backtest/results
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          probe() { code=$(curl -s -o /tmp/p -w "%{http_code}" --http1.1 --max-time 25 -A "$UA" -H "Accept: text/csv,text/html,*/*" "$2"); echo "$1 | $code | $(wc -c </tmp/p) bytes | $(head -c 120 /tmp/p | tr '\n\r' '  ')"; }
          {
          probe fred_csv_h11 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=T10Y2Y"
          probe fred_txt "https://fred.stlouisfed.org/data/T10Y2Y.txt"
          probe alfred "https://alfred.stlouisfed.org/graph/alfredgraph.csv?id=T10Y2Y"
          probe fred_api "https://api.stlouisfed.org/fred/series/observations?series_id=T10Y2Y&file_type=json"
          probe fed_ddp "https://www.federalreserve.gov/datadownload/Output.aspx?rel=H15&series=bf17364827e38702b42a58cf8eaa3f78&lastobs=&from=&to=&filetype=csv&label=include&layout=seriescolumn"
          probe fed_chargeoff "https://www.federalreserve.gov/releases/chargeoff/delallsa.htm"
          probe fed_h8 "https://www.federalreserve.gov/releases/h8/current/default.htm"
          probe treasury "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/all/all?type=daily_treasury_yield_curve&field_tdr_date_value=all&page&_format=csv"
          probe dbnomics "https://api.db.nomics.world/v22/series/FED/H15?limit=1"
          probe yahoo "https://query1.finance.yahoo.com/v8/finance/chart/XLF?range=1mo&interval=1d"
          probe stooq "https://stooq.com/q/d/l/?s=xlf.us&i=m"
          probe oecd "https://sdmx.oecd.org/public/rest/data/OECD.SDD.STES,DSD_STES@DF_FINMARK,4.0/USA.M.IR3TIB.PA.....?startPeriod=2020-01&format=csvfile"
          probe nasdaq_dl "https://data.nasdaq.com/api/v3/datasets/FRED/T10Y2Y.csv"
          probe github_raw_fred "https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv"
          } 2>&1 | tee backtest/results/probe.log
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/results/probe.log && git commit -m "probe log" && git pull --rebase origin main && git push
